<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shalimar Lotto - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg1: #0b0710;
            --bg2: #2a0b1a;
            --accent: #ffdd00;
            --accent-dark: #ff7300;
            --danger: #ff6b6b;
            --success: #2ecc71;
            --warning: #f39c12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif }
        body { background: linear-gradient(135deg, var(--bg1), #19101a 40%, #200f12 100%); color: #fff; padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; }
        header h1 { color: var(--accent); margin-bottom: 10px; }
        .admin-section { background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }
        .admin-section h2 { color: var(--accent); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.03); color: #fff; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent-dark)); color: #111827; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 150px; }
        .status { padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
        .status.success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; display: block; }
        .status.error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; display: block; }
        .status.warning { background: rgba(243, 156, 18, 0.2); color: #f39c12; display: block; }
        .status.info { background: rgba(52, 152, 219, 0.2); color: #3498db; display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { background: rgba(255, 255, 255, 0.03); color: var(--accent); }
        .user-info { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; padding: 10px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top: 3px solid var(--accent); width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; margin-left: 10px; }
        .toggle-switch { position: relative; display: inline-block; width: 60px; height: 30px; margin-left: 15px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(30px); }
        .auto-update-status { margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); }
        .debug-info { font-family: monospace; background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 12px; overflow-x: auto; }
        .tools-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .tools-row .btn { flex: 1; min-width: 200px; }
        .progress-bar { width: 100%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 10px; display: none; }
        .progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); width: 0%; transition: width 0.3s; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 600px) { .row { flex-direction: column; } .tools-row .btn { min-width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SHALIMAR LOTTO ADMIN PANEL</h1>
            <p>Manage results and system settings</p>
        </header>
        <div class="admin-section">
            <h2>Authentication</h2>
            <div id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter admin email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" id="login-btn">Login</button>
                <div class="status" id="login-status"></div>
            </div>
            <div id="admin-content" style="display: none;">
                <!-- Admin functionality will be loaded here after login -->
            </div>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
      import { getDatabase, ref, set, get, remove, orderByKey, limitToLast, query, push, update } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCXh8qfMPANNwHtrxDMG6rNGAvh-dyZFQc",
        authDomain: "database-lotto.firebaseapp.com",
        databaseURL: "https://database-lotto-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "database-lotto",
        storageBucket: "database-lotto.appspot.com",
        messagingSenderId: "349794805518",
        appId: "1:349794805518:web:b37c6f4559ee1b29d0995f",
        measurementId: "G-M5GE093GRF"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      const database = getDatabase(app);

      function nowIST() {
        const istStr = new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
        return new Date(istStr);
      }

      function isWithinLotteryHours(now) {
        const h = now.getHours();
        const m = now.getMinutes();
        if (h === 21 && m < 15) return true;
        return (h >= 9 && h < 21);
      }

      const autoUpdate = {
        isActive: false,
        timer: null,
        lastDrawTime: null,
        
        start: function() {
          if (this.isActive) return;
          this.isActive = true;
          localStorage.setItem('autoUpdate', 'true');
          this.timer = setInterval(() => {
            this.checkAndPerformDraw();
          }, 1000);
          console.log('Auto-update started');
          this.updateUI();
          showStatus('auto-update-status', 'Auto-update started. Results will generate automatically at :00, :15, :30, :45 IST.', 'success');
        },
        
        stop: function() {
          if (!this.isActive) return;
          this.isActive = false;
          localStorage.setItem('autoUpdate', 'false');
          if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
          }
          console.log('Auto-update stopped');
          this.updateUI();
          showStatus('auto-update-status', 'Auto-update stopped.', 'warning');
        },
        
        toggle: function() {
          if (this.isActive) {
            this.stop();
          } else {
            this.start();
          }
        },
        
        checkAndPerformDraw: function() {
          const now = nowIST();
          const minutes = now.getMinutes();
          const seconds = now.getSeconds();
          
          this.updateDebugInfo(now, minutes, seconds);
          
          if(!isWithinLotteryHours(now)) {
            return;
          }
          
          if(minutes % 15 === 0 && seconds >= 0 && seconds <= 10) {
            const drawTime = new Date(now);
            drawTime.setSeconds(0, 0);
            const drawTimeStr = drawTime.toISOString();
            
            if(this.lastDrawTime !== drawTimeStr) {
              console.log('Performing auto-draw for:', drawTime.toLocaleTimeString('en-IN'));
              
              const drawKey = drawTime.toISOString().replace(/[:.]/g, '-');
              const drawRef = ref(database, `lottery/${drawKey}`);
              
              get(drawRef).then((snapshot) => {
                if (!snapshot.exists()) {
                  this.performAutoDraw(drawTime);
                  this.lastDrawTime = drawTimeStr;
                } else {
                  console.log('Draw already exists for:', drawTime.toLocaleTimeString('en-IN'));
                  this.lastDrawTime = drawTimeStr;
                }
              }).catch(error => {
                console.error('Error checking draw existence:', error);
              });
            }
          }
        },
        
        performAutoDraw: function(drawTime) {
          const A = Math.floor(Math.random() * 10);
          const B = Math.floor(Math.random() * 10);
          const C = Math.floor(Math.random() * 10);
          
          const entry = {
            dateISO: drawTime.toISOString(),
            A: A,
            B: B,
            C: C,
            slot: `${String(drawTime.getHours()).padStart(2, '0')}:${String(drawTime.getMinutes()).padStart(2, '0')}`,
            autoGenerated: true
          };
          
          const key = drawTime.toISOString().replace(/[:.]/g, '-');
          set(ref(database, `lottery/${key}`), entry)
            .then(() => {
              console.log('Auto-draw saved successfully:', entry);
              showStatus('auto-update-status', `Auto-generated draw: ${A}-${B}-${C} at ${drawTime.toLocaleTimeString('en-IN')} IST`, 'success');
              loadRecentResults();
            })
            .catch(error => {
              console.error('Error saving auto-draw:', error);
              showStatus('auto-update-status', 'Error saving auto-draw: ' + error.message, 'error');
            });
        },
        
        updateUI: function() {
          const toggleBtn = document.getElementById('auto-update-toggle');
          const statusText = document.getElementById('auto-update-status-text');
          
          if (toggleBtn) {
            toggleBtn.checked = this.isActive;
          }
          
          if (statusText) {
            statusText.textContent = this.isActive ? 
              'ACTIVE - Auto-generating results every 15 minutes (IST)' : 
              'INACTIVE - Manual mode';
            statusText.style.color = this.isActive ? 'var(--success)' : 'var(--warning)';
          }
        },
        
        updateDebugInfo: function(now, minutes, seconds) {
          const debugElement = document.getElementById('debug-info');
          if (debugElement) {
            const isDrawTime = minutes % 15 === 0 && seconds >= 0 && seconds <= 10;
            const isWithinHours = isWithinLotteryHours(now);
            
            debugElement.innerHTML = `
              <div>IST Time: ${now.toLocaleTimeString('en-IN')}</div>
              <div>Minutes: ${minutes}, Seconds: ${seconds}</div>
              <div>Is Draw Time: ${isDrawTime ? 'YES' : 'NO'}</div>
              <div>Within Lottery Hours: ${isWithinHours ? 'YES' : 'NO'}</div>
              <div>Last Draw: ${this.lastDrawTime || 'None'}</div>
            `;
          }
        },
        
        init: function() {
          if (localStorage.getItem('autoUpdate') === 'true') {
            this.start();
          } else {
            this.updateUI();
          }
        }
      };

      onAuthStateChanged(auth, (user) => {
        if (user) {
          document.getElementById('login-form').style.display = 'none';
          document.getElementById('admin-content').style.display = 'block';
          loadAdminPanel(user);
          autoUpdate.init();
        } else {
          document.getElementById('login-form').style.display = 'block';
          document.getElementById('admin-content').style.display = 'none';
        }
      });

      document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) {
          showStatus('login-status', 'Please enter both email and password', 'error');
          return;
        }
        const loginBtn = document.getElementById('login-btn');
        loginBtn.disabled = true;
        loginBtn.innerHTML = 'Logging in <span class="loader"></span>';
        try {
          await signInWithEmailAndPassword(auth, email, password);
          showStatus('login-status', 'Login successful!', 'success');
        } catch (error) {
          showStatus('login-status', 'Error: ' + error.message, 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = 'Login';
        }
      });

      function loadAdminPanel(user) {
        document.getElementById('admin-content').innerHTML = `
          <div class="user-info">
            <div>Logged in as: <strong>${user.email}</strong></div>
            <button class="btn btn-warning" id="logout-btn">Logout</button>
          </div>
          
          <div class="admin-section">
            <h2>Auto Results Generation</h2>
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
              <label for="auto-update-toggle" style="margin: 0;">Auto-generate results:</label>
              <label class="toggle-switch">
                <input type="checkbox" id="auto-update-toggle">
                <span class="slider"></span>
              </label>
            </div>
            <div class="auto-update-status">
              Status: <span id="auto-update-status-text">INACTIVE - Manual mode</span>
            </div>
            <div class="status" id="auto-update-status"></div>
            <div class="debug-info" id="debug-info">
              Debug information will appear here when auto-update is active
            </div>
          </div>
          
          <div class="admin-section">
            <h2>Manage Satta Results</h2>
            <div class="form-group">
              <label for="satta-date">Date</label>
              <input type="date" id="satta-date" value="${new Date().toISOString().split('T')[0]}">
            </div>
            <div class="form-group">
              <label for="satta-value">Result (00-99)</label>
              <input type="number" id="satta-value" min="0" max="99" maxlength="2" placeholder="e.g., 07">
            </div>
            <button class="btn btn-primary" id="save-satta">Save Satta Result</button>
            <div class="status" id="satta-status"></div>
          </div>
          
          <div class="admin-section">
            <h2>Manual Lottery Draw</h2>
            <div class="form-group">
              <label for="lottery-datetime">Date & Time (IST)</label>
              <input type="datetime-local" id="lottery-datetime">
            </div>
            <div class="row">
              <div class="col">
                <label for="lottery-a">A (0-9)</label>
                <input type="number" id="lottery-a" min="0" max="9">
              </div>
              <div class="col">
                <label for="lottery-b">B (0-9)</label>
                <input type="number" id="lottery-b" min="0" max="9">
              </div>
              <div class="col">
                <label for="lottery-c">C (0-9)</label>
                <input type="number" id="lottery-c" min="0" max="9">
              </div>
            </div>
            <button class="btn btn-primary" id="save-lottery">Save Lottery Draw</button>
            <div class="status" id="lottery-status"></div>
          </div>
          
          <div class="admin-section">
            <h2>Recent Results</h2>
            <div class="row">
              <div class="col">
                <h3>Latest Satta</h3>
                <div id="recent-satta"></div>
              </div>
              <div class="col">
                <h3>Latest Lottery</h3>
                <div id="recent-lottery"></div>
              </div>
            </div>
          </div>
          
          <div class="admin-section">
            <h2>System Tools</h2>
            <div class="tools-row">
              <button class="btn btn-primary" id="backfill-btn">
                <i class="fas fa-fill-drip"></i> Backfill Missing Draws
              </button>
              <button class="btn btn-danger" id="prune-btn">
                <i class="fas fa-trash"></i> Prune Old Data (1+ year)
              </button>
            </div>
            <div class="progress-bar" id="progress-bar">
              <div class="fill" id="progress-fill"></div>
            </div>
            <div class="status" id="tools-status"></div>
          </div>
        `;

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('lottery-datetime').value = now.toISOString().slice(0, 16);

        document.getElementById('auto-update-toggle').addEventListener('change', function() {
          autoUpdate.toggle();
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
          await signOut(auth);
          showStatus('login-status', 'Logged out successfully', 'success');
        });
        loadRecentResults();
        document.getElementById('save-satta').addEventListener('click', saveSattaResult);
        document.getElementById('save-lottery').addEventListener('click', saveLotteryDraw);
        document.getElementById('backfill-btn').addEventListener('click', backfillDraws);
        document.getElementById('prune-btn').addEventListener('click', pruneOldData);
        
        autoUpdate.updateUI();
      }

      async function loadRecentResults() {
        try {
          const sattaRef = query(ref(database, 'satta'), orderByKey(), limitToLast(5));
          const sattaSnap = await get(sattaRef);
          let sattaHtml = '<table><tr><th>Date</th><th>Result</th></tr>';
          const sattaData = sattaSnap.val() || {};
          const sattaKeys = Object.keys(sattaData).sort().reverse();
          sattaKeys.forEach(key => {
            sattaHtml += `<tr><td>${key}</td><td>${sattaData[key]}</td></tr>`;
          });
          sattaHtml += '</table>';
          document.getElementById('recent-satta').innerHTML = sattaHtml || '<p>No satta results found</p>';

          const lotteryRef = query(ref(database, 'lottery'), orderByKey(), limitToLast(5));
          const lotterySnap = await get(lotteryRef);
          let lotteryHtml = '<table><tr><th>Date/Time</th><th>A</th><th>B</th><th>C</th></tr>';
          const lotteryData = lotterySnap.val() || {};
          const lotteryKeys = Object.keys(lotteryData).sort().reverse();
          lotteryKeys.forEach(key => {
            const data = lotteryData[key];
            lotteryHtml += `<tr><td>${data.dateISO ? new Date(data.dateISO).toLocaleString() : key}</td><td>${data.A}</td><td>${data.B}</td><td>${data.C}</td></tr>`;
          });
          lotteryHtml += '</table>';
          document.getElementById('recent-lottery').innerHTML = lotteryHtml || '<p>No lottery results found</p>';
        } catch (error) {
          console.error('Error loading recent results:', error);
        }
      }

      async function saveSattaResult() {
        const date = document.getElementById('satta-date').value;
        const value = document.getElementById('satta-value').value;
        if (!date || value === '') {
          showStatus('satta-status', 'Please fill all fields', 'error');
          return;
        }
        if (!/^\d{1,2}$/.test(value) && !/^\d{2}$/.test(value)) {
          showStatus('satta-status', 'Satta must be 00-99', 'error');
          return;
        }
        const paddedValue = String(Number(value)).padStart(2, '0');
        try {
          await set(ref(database, `satta/${date}`), paddedValue);
          showStatus('satta-status', 'Satta result saved successfully', 'success');
          document.getElementById('satta-value').value = '';
          loadRecentResults();
        } catch (error) {
          showStatus('satta-status', 'Error: ' + error.message, 'error');
        }
      }

      async function saveLotteryDraw() {
        const datetime = document.getElementById('lottery-datetime').value;
        const a = document.getElementById('lottery-a').value;
        const b = document.getElementById('lottery-b').value;
        const c = document.getElementById('lottery-c').value;
        if (!datetime) {
          showStatus('lottery-status', 'Please select a date and time', 'error');
          return;
        }
        const drawDate = new Date(datetime);
        const aVal = a !== '' ? parseInt(a) : Math.floor(Math.random() * 10);
        const bVal = b !== '' ? parseInt(b) : Math.floor(Math.random() * 10);
        const cVal = c !== '' ? parseInt(c) : Math.floor(Math.random() * 10);
        const entry = {
          dateISO: drawDate.toISOString(),
          A: aVal,
          B: bVal,
          C: cVal,
          slot: `${String(drawDate.getHours()).padStart(2, '0')}:${String(drawDate.getMinutes()).padStart(2, '0')}`
        };
        const key = drawDate.toISOString().replace(/[:.]/g, '-');
        try {
          await set(ref(database, `lottery/${key}`), entry);
          showStatus('lottery-status', 'Lottery draw saved successfully', 'success');
          document.getElementById('lottery-a').value = '';
          document.getElementById('lottery-b').value = '';
          document.getElementById('lottery-c').value = '';
          loadRecentResults();
        } catch (error) {
          showStatus('lottery-status', 'Error: ' + error.message, 'error');
        }
      }

      // ============================================
      // BACKFILL MISSING DRAWS - FULLY IMPLEMENTED
      // ============================================
      async function backfillDraws() {
        const btn = document.getElementById('backfill-btn');
        const statusEl = document.getElementById('tools-status');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Backfilling...';
        statusEl.className = 'status info';
        statusEl.textContent = '⏳ Scanning for missing draws...';
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';

        try {
          const startDate = new Date(2020, 0, 1);
          const endDate = nowIST();
          const allDates = [];
          let current = new Date(startDate);
          
          while (current <= endDate) {
            allDates.push(new Date(current));
            current.setDate(current.getDate() + 1);
          }

          const lotterySnapshot = await get(ref(database, 'lottery'));
          const existingLottery = lotterySnapshot.val() || {};
          const existingKeys = Object.keys(existingLottery);
          
          let totalGenerated = 0;
          let totalProcessed = 0;
          let skippedCount = 0;

          // Generate date range for lottery draws (9:00 AM to 9:00 PM, every 15 min)
          for (let dateIdx = 0; dateIdx < allDates.length; dateIdx++) {
            const date = allDates[dateIdx];
            const dateKey = date.toISOString().split('T')[0];
            
            // Check if this date has lottery data
            const hasLotteryForDate = existingKeys.some(key => key.startsWith(dateKey));
            
            if (!hasLotteryForDate) {
              // Generate draws for this date
              for (let hour = 9; hour <= 21; hour++) {
                for (let minute = 0; minute < 60; minute += 15) {
                  if (hour === 21 && minute >= 15) break;
                  
                  const drawTime = new Date(date);
                  drawTime.setHours(hour, minute, 0, 0);
                  
                  if (drawTime > endDate) break;
                  
                  const key = drawTime.toISOString().replace(/[:.]/g, '-');
                  
                  // Check if this specific draw exists
                  if (!existingKeys.includes(key)) {
                    const A = Math.floor(Math.random() * 10);
                    const B = Math.floor(Math.random() * 10);
                    const C = Math.floor(Math.random() * 10);
                    
                    const entry = {
                      dateISO: drawTime.toISOString(),
                      A: A,
                      B: B,
                      C: C,
                      slot: `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`,
                      backfilled: true
                    };
                    
                    await set(ref(database, `lottery/${key}`), entry);
                    totalGenerated++;
                  } else {
                    skippedCount++;
                  }
                  totalProcessed++;
                }
              }
            }
            
            // Update progress
            const progress = ((dateIdx + 1) / allDates.length) * 100;
            progressFill.style.width = `${progress}%`;
            
            if (dateIdx % 7 === 0) {
              statusEl.textContent = `⏳ Processing: ${dateKey} | Generated: ${totalGenerated} draws`;
            }
          }

          // Also backfill satta results if missing
          statusEl.textContent = '⏳ Backfilling Satta results...';
          let sattaGenerated = 0;
          
          for (let dateIdx = 0; dateIdx < allDates.length; dateIdx++) {
            const date = allDates[dateIdx];
            const dateKey = date.toISOString().split('T')[0];
            
            // Check if satta exists for this date
            const sattaRef = ref(database, `satta/${dateKey}`);
            const sattaSnapshot = await get(sattaRef);
            
            if (!sattaSnapshot.exists()) {
              const sattaNum = String(Math.floor(10 + Math.random() * 90)).padStart(2, '0');
              await set(ref(database, `satta/${dateKey}`), sattaNum);
              sattaGenerated++;
            }
            
            const progress = ((dateIdx + 1) / allDates.length) * 100 + 5;
            progressFill.style.width = `${Math.min(progress, 100)}%`;
          }

          progressFill.style.width = '100%';
          statusEl.className = 'status success';
          statusEl.textContent = `✅ Backfill complete! Generated ${totalGenerated} lottery draws and ${sattaGenerated} satta results. Skipped ${skippedCount} existing draws.`;
          
          loadRecentResults();

        } catch (error) {
          console.error('Backfill error:', error);
          statusEl.className = 'status error';
          statusEl.textContent = '❌ Error during backfill: ' + error.message;
        }

        setTimeout(() => {
          progressBar.style.display = 'none';
          progressFill.style.width = '0%';
        }, 5000);

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-fill-drip"></i> Backfill Missing Draws';
      }

      // ============================================
      // PRUNE OLD DATA - FULLY IMPLEMENTED
      // ============================================
      async function pruneOldData() {
        const btn = document.getElementById('prune-btn');
        const statusEl = document.getElementById('tools-status');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        
        // Confirmation dialog
        if (!confirm('⚠️ WARNING: This will permanently delete all data older than 1 year. Are you sure?')) {
          return;
        }
        
        if (!confirm('⚠️ FINAL WARNING: This action cannot be undone. Continue?')) {
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Pruning...';
        statusEl.className = 'status warning';
        statusEl.textContent = '⏳ Scanning for old data...';
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';

        try {
          const cutoffDate = new Date();
          cutoffDate.setFullYear(cutoffDate.getFullYear() - 1);
          const cutoffKey = cutoffDate.toISOString().split('T')[0];
          
          let lotteryDeleted = 0;
          let sattaDeleted = 0;

          // Prune Lottery data
          statusEl.textContent = '⏳ Pruning lottery data older than 1 year...';
          const lotterySnapshot = await get(ref(database, 'lottery'));
          const lotteryData = lotterySnapshot.val() || {};
          const lotteryKeys = Object.keys(lotteryData);
          
          let processed = 0;
          for (const key of lotteryKeys) {
            const entry = lotteryData[key];
            const entryDate = entry.dateISO ? entry.dateISO.split('T')[0] : key.split('-').slice(0, 3).join('-');
            
            if (entryDate < cutoffKey) {
              await remove(ref(database, `lottery/${key}`));
              lotteryDeleted++;
            }
            
            processed++;
            const progress = (processed / lotteryKeys.length) * 50;
            progressFill.style.width = `${progress}%`;
          }

          // Prune Satta data
          statusEl.textContent = '⏳ Pruning satta data older than 1 year...';
          const sattaSnapshot = await get(ref(database, 'satta'));
          const sattaData = sattaSnapshot.val() || {};
          const sattaKeys = Object.keys(sattaData);
          
          for (let i = 0; i < sattaKeys.length; i++) {
            const key = sattaKeys[i];
            if (key < cutoffKey) {
              await remove(ref(database, `satta/${key}`));
              sattaDeleted++;
            }
            
            const progress = 50 + ((i + 1) / sattaKeys.length) * 50;
            progressFill.style.width = `${progress}%`;
          }

          progressFill.style.width = '100%';
          statusEl.className = 'status success';
          statusEl.textContent = `✅ Prune complete! Deleted ${lotteryDeleted} lottery entries and ${sattaDeleted} satta entries.`;
          
          loadRecentResults();

        } catch (error) {
          console.error('Prune error:', error);
          statusEl.className = 'status error';
          statusEl.textContent = '❌ Error during pruning: ' + error.message;
        }

        setTimeout(() => {
          progressBar.style.display = 'none';
          progressFill.style.width = '0%';
        }, 5000);

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-trash"></i> Prune Old Data (1+ year)';
      }

      function showStatus(elementId, message, type) {
        const element = document.getElementById(elementId);
        if (element) {
          element.textContent = message;
          element.className = 'status ' + type;
          setTimeout(() => {
            element.className = 'status';
          }, 8000);
        }
      }
    </script>
